[/Script/Engine.Engine]
; Deliberately False. A fixed engine frame rate would tie rendering to the
; simulation, and the simulation already owns its own clock: ParagliderSolverClock
; steps at a fixed 120 Hz derived from delivered time, and the render rig is
; interpolated between steps. The frame cap below bounds rendering without
; touching either.
bUseFixedFrameRate=False

; PERFORMANCE PLAN, LEVEL 1. The startup baseline, so the first frames of a
; session are capped before any pilot profile has been loaded and
; ApplyGraphicsProfile has run. The per-profile values in GraphicsProfile.cpp
; govern from that point on.
;
; 120 is the simulation rate: above it a frame carries no physics and no input
; the previous frame did not, because the controls are sampled once per frame.
; determinism_tests measures the cost of capping there at 0.0007 m over 30 s of
; flight, against 8 m travelled per step. Uncapped - which is what this file
; specified by omission until now - buys nothing and costs the whole difference
; in power.
[SystemSettings]
t.MaxFPS=120
r.VSync=1

