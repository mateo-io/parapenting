; Parapenting graphics tiers target Apple Silicon first. Procedural terrain,
; HISM vegetation and atmosphere all obey the engine scalability groups.

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.55
foliage.LODDistanceScale=0.55

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.75
foliage.LODDistanceScale=0.75

[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0
foliage.LODDistanceScale=1.0

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.35
foliage.LODDistanceScale=1.25

[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.Virtual.Enable=0
r.Shadow.MaxResolution=1024

[ShadowQuality@1]
r.ShadowQuality=3
r.Shadow.Virtual.Enable=0
r.Shadow.MaxResolution=1536

[ShadowQuality@2]
r.ShadowQuality=4
r.Shadow.Virtual.Enable=1
r.Shadow.MaxResolution=2048

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.MaxResolution=4096

[EffectsQuality@0]
r.VolumetricFog=0
r.VolumetricCloud=0

[EffectsQuality@1]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=32

[EffectsQuality@2]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=64

[EffectsQuality@3]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=96

[FoliageQuality@0]
foliage.DensityScale=0.35
grass.DensityScale=0.25

[FoliageQuality@1]
foliage.DensityScale=0.60
grass.DensityScale=0.50

[FoliageQuality@2]
foliage.DensityScale=0.85
grass.DensityScale=0.75

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0
